services:
  db:
    image: postgres
    container_name: "db"
    ports:
      - "5400:5432"
    environment:
      - "POSTGRES_PASSWORD=qwerty"
      - "POSTGRES_DB=pd411_shop"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - "shop_db:/var/lib/postgresql"
    networks:
      - "shop_nt"

  api:
    build: "back/"
    image: potapchuk22/pd411_shop_api
    container_name: "shop_api"
    ports:
      - "5000:8080"
    environment:
      - "ConnectionStrings__LocalDb=User ID=postgres;Password=qwerty;Host=db;Port=5432;Database=pd411_shop;"
      - "EnableSwagger=true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "shop_api:/app/Storage"
    networks:
      - "shop_nt"
  web:
    build:
      context: "front/"
      args:
        API_URL: "http://localhost:5000/api/"
        IMAGE_URL: "http://localhost:5000/image/"
    image: potapchuk22/pd411_shop_web
    container_name: "shop_web"
    ports:
      - "80:3000"

networks:
  shop_nt:
    name: "shop_nt"

volumes:
  shop_db:
    name: "shop_db"
  shop_api:
    name: "shop_api"
